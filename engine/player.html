<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Titel"; src: url("../fonts/Anton-Regular.ttf"); }
@font-face { font-family: "Kraft"; src: url("../fonts/ArchivoBlack-Regular.ttf"); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
#buehne { position: absolute; inset: 0; overflow: hidden; background: var(--bg1); }
#hg { position: absolute; inset: -10%; }
.szene { position: absolute; inset: 0; display: none; }
.szene .kopf {
  position: absolute; left: 70px; right: 70px; top: 230px; text-align: center;
  font-family: "Titel"; font-size: 118px; line-height: 1.02; letter-spacing: 1px;
  color: var(--text); text-transform: uppercase; text-shadow: 0 8px 0 rgba(0,0,0,.45);
  -webkit-text-stroke: 16px #000; paint-order: stroke fill;
}
.szene .kopf b { color: var(--akzent); font-weight: normal; }
.szene .foto { position: absolute; inset: 0; overflow: hidden; }
.szene .foto .ebene { position: absolute; inset: 0; transform-origin: 50% 45%; }
.szene .foto img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.szene .foto svg.ueber { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; z-index: 2; }
.szene .foto svg.ueber [data-a] { transform-box: fill-box; transform-origin: center; }
.szene .foto::after { content: ""; position: absolute; inset: 0;
  background: linear-gradient(rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 26%, rgba(0,0,0,0) 62%, rgba(0,0,0,.6) 100%); }
.szene .bild { position: absolute; left: 90px; top: 560px; width: 900px; height: 900px; }
.szene .bild svg { width: 100%; height: 100%; overflow: visible; }
.szene .bild svg [data-a] { transform-box: fill-box; transform-origin: center; }
#untertitel {
  position: absolute; left: 60px; right: 60px; top: 1500px; height: 260px;
  display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 4px 22px;
  font-family: "Kraft"; font-size: 78px; line-height: 1.12; text-transform: uppercase;
}
#untertitel span {
  color: #fff; display: inline-block;
  -webkit-text-stroke: 14px #000; paint-order: stroke fill;
  text-shadow: 0 8px 0 rgba(0,0,0,.55);
}
#untertitel span.an { color: var(--akzent); }
#balken { position: absolute; left: 0; top: 0; height: 12px; background: var(--akzent); }
#blitz { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
#cover { position: absolute; inset: 0; display: none; }
.szene .foto svg.objekt { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; filter: drop-shadow(0 18px 30px rgba(0,0,0,.6)); }
.szene .label { position: absolute; left: 50%; top: 105px; transform: translateX(-50%); padding: 8px 28px 4px; border-radius: 40px;
  font-family: "Titel"; font-size: 54px; letter-spacing: 2px; color: #000; background: var(--akzent); border: 6px solid #000; white-space: nowrap; }
#hook { position: absolute; left: 40px; right: 40px; top: 640px; text-align: center; font-family: "Titel"; font-size: 200px; line-height: 1;
  color: #fff; text-transform: uppercase; -webkit-text-stroke: 22px #000; paint-order: stroke fill; text-shadow: 0 14px 0 rgba(0,0,0,.5); opacity: 0; z-index: 5; }
#hook b { color: var(--akzent); font-weight: normal; }
#untertitel span.emo { -webkit-text-stroke: 0; text-shadow: none; font-family: "Noto Color Emoji"; font-size: 92px; }
</style>
</head>
<body>
<div id="buehne">
  <svg id="hg" viewBox="0 0 1296 2304" preserveAspectRatio="none"></svg>
  <div id="szenen"></div>
  <div id="hook"></div>
  <div id="untertitel"></div>
  <div id="balken"></div>
  <div id="blitz"></div>
</div>
<script>
// Wird von render.js befüllt: window.PROJEKT und window.TIMING
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = p => 1 - Math.pow(1 - p, 3);                      // easeOutCubic
const back = p => { const c = 1.9; p = p - 1; return 1 + (c + 1) * p*p*p + c * p*p; }; // easeOutBack
const elastisch = p => p === 0 || p === 1 ? p : Math.pow(2, -10 * p) * Math.sin((p * 10 - 0.75) * (2 * Math.PI / 3)) + 1;

let P, T, szenenEls = [], woerter = [];

function aufbauen() {
  P = window.PROJEKT; T = window.TIMING;
  const st = Object.assign({ bg1: "#141331", bg2: "#2a1f63", akzent: "#ffd23f", text: "#ffffff", form: "#ffffff" }, P.stil || {});
  const r = document.documentElement.style;
  r.setProperty("--bg1", st.bg1); r.setProperty("--akzent", st.akzent); r.setProperty("--text", st.text);

  // Hintergrund: Verlauf + schwebende Formen
  const hg = document.getElementById("hg");
  let h = `<defs><radialGradient id="vg" cx="50%" cy="42%" r="75%"><stop offset="0" stop-color="${st.bg2}"/><stop offset="1" stop-color="${st.bg1}"/></radialGradient></defs>
    <rect width="1296" height="2304" fill="url(#vg)"/>`;
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 26; i++) {
    const x = rnd() * 1296, y = rnd() * 2304, s = 6 + rnd() * 26, typ = i % 3;
    const f = `fill="${st.form}" opacity="${0.04 + rnd() * 0.08}"`;
    h += `<g class="deko" data-x="${x}" data-y="${y}" data-v="${0.3 + rnd()}" data-p="${rnd() * 6}">` +
      (typ === 0 ? `<circle r="${s}" ${f}/>` : typ === 1 ? `<rect x="${-s}" y="${-s}" width="${2*s}" height="${2*s}" rx="${s/3}" ${f}/>`
        : `<path d="M0 ${-s*1.3} L${s*1.2} ${s} L${-s*1.2} ${s}Z" ${f}/>`) + `</g>`;
  }
  hg.innerHTML = h;

  window.EREIGNISSE = [];
  if (P.hook) { document.getElementById("hook").innerHTML = P.hook.text; window.EREIGNISSE.push({ t: 0.05, art: "bass" }); }
  const cont = document.getElementById("szenen");
  P.szenen.forEach((sz, i) => {
    const d = document.createElement("div");
    d.className = "szene";
    d.innerHTML = (sz.foto ? `<div class="foto"><div class="ebene"><img src="${sz.foto}">${sz.objekt ? `<svg class="objekt" viewBox="0 0 1080 1920" style="transform-origin:${sz.objekt.x}px ${sz.objekt.y}px"><defs><mask id="om${i}"><image href="${sz.objekt.maske}" width="1080" height="1920"/></mask></defs><image href="${sz.foto}" width="1080" height="1920" preserveAspectRatio="xMidYMid slice" mask="url(#om${i})"/></svg>` : ""}<svg class="ueber" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">${(sz.ueber || "").split("__FOTO__").join(sz.foto)}</svg></div></div>` : "") + (sz.kopf ? `<div class="kopf">${sz.kopf}</div>` : "") + `<div class="bild">${sz.bild || ""}</div>` + (sz.label ? `<div class="label">${sz.label}</div>` : "");
    cont.appendChild(d);
    szenenEls.push(d);
    // Hervorhebungen desselben Objekts mit der 3D-Objekt-Ebene mitbewegen
    if (sz.objekt) {
      const stem = sz.objekt.maske.split("/").pop().replace(/\.png$/, "");
      [...d.querySelectorAll("svg.ueber mask")].filter(m => (m.querySelector("image")?.getAttribute("href") || "").includes(stem)).forEach(m => {
        d.querySelectorAll(`svg.ueber [mask="url(#${m.id})"]`).forEach(x => {
          let g = x; while (g.parentNode && !g.parentNode.matches("svg.ueber")) g = g.parentNode;
          if (g.parentNode.classList?.contains("mitobjekt")) return;
          const w = document.createElementNS("http://www.w3.org/2000/svg", "g");
          w.setAttribute("class", "mitobjekt");
          w.setAttribute("style", `transform-box:view-box;transform-origin:${sz.objekt.x}px ${sz.objekt.y}px`);
          g.parentNode.insertBefore(w, g); w.appendChild(g);
        });
      });
    }
    // Animationen an gesprochene Wörter koppeln: data-wort="herzen" (optional data-n="2" für das 2. Vorkommen)
    const norm = x => x.toLowerCase().normalize("NFC").replace(/[^a-z0-9äöüß]/g, "");
    const wsz = T.woerter.filter(w => w.szene === i);
    const zeitVon = (wort, n) => {
      const ziel = norm(wort); let k = 0;
      for (const w of wsz) if (norm(w.wort).startsWith(ziel) && ++k >= (n || 1)) return w.start - T.szenen[i].start;
      console.warn("Wort nicht gefunden:", wort); return null;
    };
    d.querySelectorAll("[data-wort]").forEach(el => {
      const z = zeitVon(el.dataset.wort, +el.dataset.n);
      if (z !== null) el.dataset.d = Math.max(0, z + parseFloat(el.dataset.plus || 0));
    });
    d.querySelectorAll("[data-aus-wort]").forEach(el => {
      const z = zeitVon(el.dataset.ausWort, +el.dataset.ausN);
      if (z !== null) el.dataset.aus = z;
    });
    d.querySelectorAll("[data-ton]").forEach(el => {
      if (el.dataset.d === undefined) return;
      const tz = T.szenen[i].start + parseFloat(el.dataset.d) + (el.dataset.ton === "pling" ? parseFloat(el.dataset.tondauer || 0) : 0);
      window.EREIGNISSE.push({ t: +tz.toFixed(3), art: el.dataset.ton });
    });
    // Zeichenlängen für "draw"-Animation vorberechnen
    d.style.display = "block";
    d.querySelectorAll('[data-a~="draw"]').forEach(el => {
      const teile = el.matches("path,line,polyline,polygon,circle,rect,ellipse") ? [el] : [...el.querySelectorAll("path,line,polyline,polygon,circle,rect,ellipse")];
      teile.forEach(t => { try { const L = t.getTotalLength(); t.dataset.len = L; t.style.strokeDasharray = L; } catch (e) {} });
      el._teile = teile;
    });
    d.style.display = "none";
  });
  woerter = T.woerter;
}

const fmtDE = (v, nk) => v.toFixed(nk).replace(".", "#").replace(/\B(?=(\d{3})+(?!\d))/g, ".").replace("#", ",");
function animiereElemente(root, t) {
  root.querySelectorAll("[data-zaehl]").forEach(el => {
    const g = el.closest("[data-d]"), st = parseFloat(g ? g.dataset.d : 0), dz = +el.dataset.zdauer;
    const p = ease(clamp((t - st) / dz)), von = +el.dataset.von, bis = +el.dataset.bis;
    el.textContent = el.dataset.vor + fmtDE(von + (bis - von) * p, +el.dataset.nk) + el.dataset.nach;
  });
  root.querySelectorAll("[data-a]").forEach(el => {
    const arten = el.dataset.a.split(/\s+/);
    const start = parseFloat(el.dataset.d || 0), dauer = parseFloat(el.dataset.l || 0.6);
    const p = clamp((t - start) / dauer);
    let tf = "", op = 1;
    for (const a of arten) {
      if (a === "pop") { const s = back(p); tf += ` scale(${Math.max(0, s)})`; op *= clamp(p * 4); }
      else if (a === "fade") op *= ease(p);
      else if (a === "hoch") { tf += ` translateY(${(1 - ease(p)) * 160}px)`; op *= ease(p); }
      else if (a === "runter") { tf += ` translateY(${-(1 - ease(p)) * 160}px)`; op *= ease(p); }
      else if (a === "links") { tf += ` translateX(${(1 - ease(p)) * 500}px)`; op *= ease(p); }
      else if (a === "rechts") { tf += ` translateX(${-(1 - ease(p)) * 500}px)`; op *= ease(p); }
      else if (a === "wachsen") tf += ` scaleY(${ease(p)})`;
      else if (a === "breit") tf += ` scaleX(${ease(p)})`;
      else if (a === "dreh") tf += ` rotate(${(1 - ease(p)) * -180}deg) scale(${ease(p)})`;
      else if (a === "federn") { tf += ` scale(${elastisch(p)})`; op *= clamp(p * 5); }
      else if (a === "schweben") tf += ` translateY(${Math.sin((t - start) * 2.2) * 14}px)`;
      else if (a === "puls") tf += ` scale(${1 + Math.max(0, Math.sin((t - start) * 5)) * 0.07})`;
      else if (a === "wackeln") tf += ` rotate(${Math.sin((t - start) * 7) * 6}deg)`;
      else if (a === "heben") { tf += ` scale(${1 + 0.05 * ease(p)})`; op *= clamp(p * 3); }
      else if (a === "blink") op *= t < start ? 1 : 0.3 + 0.7 * (0.5 + 0.5 * Math.cos((t - start) * Math.PI * 2 * 2.2));
      else if (a === "sonar") { const k = ((t - start) % 1.1) / 1.1; tf += ` scale(${0.6 + k * 0.9})`; op *= (1 - k); }
      else if (a === "glimmen") tf += ` scale(${1 + 0.08 * (0.5 + 0.5 * Math.sin((t - start) * 9))})`;
      else if (a === "kreisen") tf += ` rotate(${(t - start) * 40}deg)`;
      else if (a === "draw") {
        (el._teile || []).forEach(tt => {
          const L = +tt.dataset.len || 0; tt.style.strokeDashoffset = L * (1 - ease(p));
          if (tt.dataset.fill !== "0") tt.style.fillOpacity = clamp((p - 0.6) / 0.4);
        });
        if (p <= 0) op = 0;
      }
    }
    if (t < start && !arten.includes("draw")) op = 0;
    if (el.dataset.halten) op *= 1 - clamp((t - start - parseFloat(el.dataset.halten)) / 0.4);
    if (el.dataset.aus) op *= 1 - clamp((t - parseFloat(el.dataset.aus)) / 0.3);
    el.style.transform = tf; el.style.opacity = op;
  });
}

window.zeige = function (t) {
  const sz = T.szenen;
  // Kamerafahrt je Szene: Zoom rein/raus, Schwenk links/rechts/hoch/runter.
  // Lange Szenen werden in zwei Abschnitte mit kurzem Zoom-Ruck geteilt (wirkt wie ein Schnitt).
  // Pro Szene festlegbar mit "kamera": ["rein","links"] in projekt.json.
  function kamera(i, lokal, dauer) {
    const FAHRTEN = ["rein", "links", "raus", "rechts", "hoch", "rein", "runter", "links", "raus"];
    const eigene = (P.szenen[i] || {}).kamera;
    const teile = dauer > 4.5 ? 2 : 1;
    const len = dauer / teile, k = Math.min(teile - 1, Math.floor(lokal / len));
    const q = clamp((lokal - k * len) / len), e = q < .5 ? 2 * q * q : 1 - Math.pow(-2 * q + 2, 2) / 2;
    const art = (eigene && eigene[k]) || FAHRTEN[(i * 2 + k) % FAHRTEN.length];
    let s = 1.08, x = 0, y = 0;
    if (i === P.szenen.length - 1) return "none";  // Logo-Szene: Kamera steht still
    if (art === "rein") s = 1.04 + 0.08 * e;
    else if (art === "raus") s = 1.12 - 0.08 * e;
    else if (art === "links") x = 30 - 60 * e;
    else if (art === "rechts") x = -30 + 60 * e;
    else if (art === "hoch") y = 45 - 90 * e;
    else if (art === "runter") y = -45 + 90 * e;
    const ruck = k > 0 ? 0.04 * Math.max(0, 1 - (lokal - k * len) / 0.25) : 0;  // Zoom-Schlag beim 2. Abschnitt
    return `scale(${s + ruck}) translate(${x}px, ${y}px)`;
  }

  let idx = sz.findIndex(s => t >= s.start && t < s.start + s.dauer);
  if (idx < 0) idx = t <= 0 ? 0 : sz.length - 1;
  const lokal = t - sz[idx].start;

  // Hintergrund bewegt sich langsam
  document.querySelectorAll("#hg .deko").forEach(g => {
    const v = +g.dataset.v, ph = +g.dataset.p;
    const y = (+g.dataset.y - t * 40 * v) % 2304;
    g.setAttribute("transform", `translate(${+g.dataset.x + Math.sin(t * .6 + ph) * 30} ${y < 0 ? y + 2304 : y}) rotate(${t * 20 * v})`);
  });

  szenenEls.forEach((el, i) => {
    if (i !== idx) { el.style.display = "none"; return; }
    el.style.display = "block";
    // Einstieg: wechselnde Übergänge (Zoom-Schlag, Wischen, Hochschieben, Dreh-Zoom)
    const ein = clamp(lokal / 0.35), e1 = 1 - ease(ein);
    const letzte = i === P.szenen.length - 1;
    const typ = i === 0 || letzte ? "zoom" : ["wisch", "zoom", "hoch", "dreh"][i % 4];
    let tf = "";
    if (typ === "zoom") tf = letzte || i === 0 ? "" : `scale(${1 + 0.12 * e1})`;
    else if (typ === "wisch") tf = `translateX(${e1 * 1080 * (i % 8 < 4 ? 1 : -1)}px)`;
    else if (typ === "hoch") tf = `translateY(${e1 * 900}px)`;
    else tf = `rotate(${e1 * 8}deg) scale(${1 + 0.25 * e1})`;
    // Beben: kurzes Wackeln bei krassen Fakten
    el.querySelectorAll("[data-beben]").forEach(b => {
      const st = parseFloat(b.dataset.d || 99), bd = parseFloat(b.dataset.bdauer), p = (lokal - st) / bd;
      if (p >= 0 && p < 1) { const a = 10 * +b.dataset.beben * (1 - p); tf += ` translate(${Math.sin(lokal * 71) * a}px, ${Math.cos(lokal * 53) * a}px) rotate(${Math.sin(lokal * 37) * a * 0.04}deg)`; }
    });
    el.style.transform = tf;
    el.style.opacity = typ === "zoom" && i > 0 ? ease(ein) : 1;
    const obj = el.querySelector(".foto svg.objekt");
    if (obj) { const q = clamp(lokal / sz[i].dauer); obj.style.transform = `scale(${1.02 + 0.04 * ease(q)}) translateY(${-10 * ease(q)}px)`;
      el.querySelectorAll(".mitobjekt").forEach(w => w.style.transform = obj.style.transform); }
    const kopf = el.querySelector(".kopf");
    const hd = i === 0 && P.hook ? (P.hook.dauer || 1.4) : 0;
    if (kopf) { const p = clamp((lokal - 0.05 - hd) / 0.45); kopf.style.transform = `translateY(${(1 - back(p)) * -60}px) scale(${0.85 + 0.15 * back(p)})`; kopf.style.opacity = clamp(p * 3); }
    const img = el.querySelector(".foto .ebene");
    if (img) img.style.transform = kamera(i, lokal, sz[i].dauer);
    animiereElemente(el, lokal);
  });

  // Hook: große Zahl/Frage in der ersten Sekunde, mit Wackeln
  const hk = document.getElementById("hook");
  if (P.hook) {
    const hd = P.hook.dauer || 1.4, p = 0.75 + 0.25 * clamp(t / 0.15), aus = clamp((t - hd + 0.25) / 0.25);
    const a = 8 * Math.max(0, 1 - t / 0.4);
    hk.style.opacity = t < hd ? 1 - aus : 0;
    hk.style.transform = `translate(${Math.sin(t * 70) * a}px, ${Math.cos(t * 55) * a}px) rotate(-4deg) scale(${back(p) * (1 + 0.04 * t) + aus * 0.3})`;
  }
  // Blitz beim Szenenwechsel (nur beim Zoom-Übergang)
  document.getElementById("blitz").style.opacity = idx > 0 && idx % 4 === 1 ? Math.max(0, 0.35 - lokal * 2.2) : 0;
  document.getElementById("balken").style.width = (t / T.gesamt * 100) + "%";

  // Untertitel: Gruppen von bis zu 3 Wörtern, aktives Wort hervorgehoben
  const ut = document.getElementById("untertitel");
  const gruppen = window._gruppen || (window._gruppen = gruppieren(woerter));
  const g = gruppen.find(g => t >= g.start && t < g.ende);
  if (!g) { ut.innerHTML = ""; return; }
  ut.innerHTML = g.w.map(w => {
    const aktiv = t >= w.start && t < (w.naechst ?? w.ende + 0.3);
    const p = clamp((t - w.start) / 0.12);
    const s = aktiv ? 1 + 0.12 * (1 - p) + 0.06 : 1;
    const nw = w.wort.toLowerCase().replace(/[^a-z0-9äöüß]/g, "");
    const emo = Object.entries(P.emojis || {}).find(([k]) => nw.startsWith(k.toLowerCase()));
    const anz = zahlwort(w.wort);
    const gross = anz.length > 11 ? `font-size:${Math.max(44, Math.round(78 * 11 / anz.length))}px;` : "";
    return `<span class="${aktiv ? "an" : ""}" style="${gross}transform:scale(${s})">${anz}</span>` + (emo && t >= w.start ? `<span class="emo" style="transform:scale(${back(clamp((t - w.start) / 0.3))})">${emo[1]}</span>` : "");
  }).join(" ");
  const gp = clamp((t - g.start) / 0.15);
  ut.style.transform = `translateY(${(1 - ease(gp)) * 30}px)`;
};

// Ausgeschriebene Zahlen in Untertiteln als Ziffern zeigen (die Stimme spricht sie trotzdem aus)
const ZAHL = { null: 0, ein: 1, eins: 1, eine: 1, einen: 1, zwei: 2, drei: 3, vier: 4, fünf: 5, sechs: 6, sieben: 7, acht: 8, neun: 9, zehn: 10, elf: 11, zwölf: 12,
  dreizehn: 13, vierzehn: 14, fünfzehn: 15, sechzehn: 16, siebzehn: 17, achtzehn: 18, neunzehn: 19, zwanzig: 20, dreißig: 30, vierzig: 40,
  fünfzig: 50, sechzig: 60, siebzig: 70, achtzig: 80, neunzig: 90 };
function unter100(t) {
  if (t in ZAHL) return ZAHL[t];
  const m = t.match(/^(.+?)und(zwanzig|dreißig|vierzig|fünfzig|sechzig|siebzig|achtzig|neunzig)$/);
  if (m && m[1] in ZAHL && ZAHL[m[1]] < 10) return ZAHL[m[1]] + ZAHL[m[2]];
  return null;
}
function unter1000(t) {
  if (t === "") return 0;
  const m = t.match(/^(.*?)hundert(.*)$/);
  if (m) { const h = m[1] === "" ? 1 : unter100(m[1]); const r = unter1000(m[2]); return h === null || r === null ? null : h * 100 + r; }
  return unter100(t);
}
function zahlwert(t) {
  const m = t.match(/^(.*?)tausend(.*)$/);
  if (m) { const a = m[1] === "" ? 1 : unter1000(m[1]); const b = unter1000(m[2]); return a === null || b === null ? null : a * 1000 + b; }
  return unter1000(t);
}
function zahlwort(wort) {
  const m = wort.match(/^([A-Za-zÄÖÜäöüß]+)([^A-Za-zÄÖÜäöüß]*)$/);
  if (!m) return wort;
  const t = m[1].toLowerCase();
  if (t.length < 9 || !/(hundert|tausend|zig|ßig|zehn)/.test(t)) return wort;  // kurze Zahlwörter bleiben Wörter
  const v = zahlwert(t);
  return v === null ? wort : v.toLocaleString("de-DE") + m[2];
}
function gruppieren(ws) {
  const out = []; let akt = [];
  ws.forEach((w, i) => {
    akt.push(w);
    const n = ws[i + 1];
    const satzende = /[.!?:,;]$/.test(w.wort);
    if (akt.length >= 3 || satzende || !n || n.szene !== w.szene || (n.start - w.ende) > 0.35) {
      akt.forEach((x, j) => x.naechst = akt[j + 1]?.start);
      out.push({ w: akt, start: akt[0].start - 0.05, ende: n && n.szene === w.szene ? n.start - 0.05 : w.ende + 0.35 });
      akt = [];
    }
  });
  return out;
}
window.aufbauen = aufbauen;
</script>
